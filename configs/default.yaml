# Конфигурация пайплайна кластеризации МО на динамической атрибутированной сети.
# Все гиперпараметры собраны здесь; запуск: python run.py pipeline (или python -m sbx pipeline --config <файл>)

seed: 42
paths:
  raw: data/raw
  processed: data/processed
  results: results
  figures: results/figures
  landing: landing

data:
  months: ["2023-01", "2024-12"]
  min_months_observed: 18        # МО с меньшим числом наблюдённых месяцев исключаются
  # Внутригородские территории Москвы и Санкт-Петербурга — части единого рынка труда, а не
  # самостоятельные локальные экономики; данных БДПМО по ним нет. В основной модели они
  # исключаются и анализируются отдельно (python run.py intracity).
  exclude_types: ["внутригородская территория города федерального значения"]
  smoothing_window: 3            # скользящее среднее (мес.) для месячных атрибутов
  rosstat_year_lag: 0            # год Росстата = год месяца (при отсутствии — ближайший доступный)
  reference_month: "2024-06"     # опорный месяц: сравнение правил рёбер, выбор k, бутстрэп, проверки, карта

features:
  # Веса блоков: после стандартизации каждый блок нормируется на sqrt(число признаков),
  # затем умножается на вес. Так блок из 11 отраслей не «перекрикивает» блок из 1 признака.
  block_weights:
    consumption_level: 1.0       # уровень безналичных расходов на жителя относительно медианы РФ
    consumption_structure: 1.0   # структура расходов (CLR-преобразование долей категорий)
    seasonality: 0.5             # сезонная амплитуда (курортность, дачность)
    industry: 1.0                # отраслевая структура занятости (CLR долей, Росстат)
    labour: 0.75                 # относительная зарплата, доля занятых в крупных и средних организациях
    geography: 0.75              # доступность рынков, размер населения
  clr_pseudocount: 0.005
  impute_neighbors: 10           # kNN-импутация признаков Росстата по профилю трат (число соседей)

graph:
  # Правило построения рёбер для основного пайплайна (см. src/sbx/network/edges.py)
  main_rule: attr               # выбран по итогам сравнения (results/edge_rules.csv)
  knn: 15                        # число соседей в kNN-графах
  self_tuning_neighbor: 7        # σ_i = расстояние до 7-го соседа (Zelnik-Manor & Perona, 2004)
  corr_window: 12                # окно (мес.) для корреляций динамики
  max_lag: 3                     # максимальный лаг (мес.) для лаговых корреляций
  dtw_window: 2                  # полоса Сакоэ–Тибы для DTW
  hybrid_alpha: 0.7              # W = α·W_attr + (1−α)·W_comove
  geo_scale_km: 150              # масштаб затухания для графа расстояний

clustering:
  k_range: [4, 14]
  k: 8                           # наибольшее k с бутстрэп-устойчивостью ≥ 0.8; при k=9 она падает до ≈0.55 (results/k_selection.csv)
  methods: [kmeans, ward, spectral, leiden, agc, temporal_leiden]
  final_method: spectral_evolutionary   # выбран по итогам сравнения (results/methods.csv)
  agc_power: 3                   # порядок низкочастотного графового фильтра (AGC)
  leiden_interslice: 0.5         # сила межслойной связи в темпоральном Leiden
  n_init: 20
  stability_bootstrap: 30        # число бутстрэп-повторов для оценки устойчивости методов
  k_selection_bootstrap: 20      # число подвыборок при выборе k
  subsample_frac: 0.8            # доля МО в подвыборке (Ben-Hur, Elisseeff & Guyon, 2002)
  k_stability_threshold: 0.8     # правило выбора k: наибольшее k с устойчивостью не ниже порога

dynamics:
  evolutionary_alpha: 0.5        # вес текущего месяца в эволюционной кластеризации (память с полупериодом 1 мес.)
  match_min_jaccard: 0.3         # порог для событий merge/split при сопоставлении кластеров

outputs:
  twins_candidates: 30           # сколько ближайших по признакам МО просматривать при поиске двойников
  twins_per_mo: 5                # сколько «экономических двойников» из других регионов показывать
  umap_neighbors: 30             # раскладка сети на лендинге (UMAP)
  umap_min_dist: 0.25

robustness:
  # варианты, на которых проверяется устойчивость итоговой модели (python run.py robustness)
  weight_factors: [0.5, 1.5, 0.0]   # множители весов каждого блока признаков; 0 — блок исключён
  knn: [10, 20]
  self_tuning_neighbor: [4, 10]
  evolutionary_alpha: [0.6, 1.0]
  seeds: [1, 7]
  spatial_neighbors: 5           # соседи по дороге для проверки пространственной связности типов
  permutations: 1000             # перестановок меток для нулевого распределения

intracity:
  # отдельный анализ внутригородских территорий Москвы и Санкт-Петербурга (python run.py intracity)
  knn: 10
  k_range: [3, 8]
