# Интерпретация кластеров (см. docs/report.md) и тексты для лендинга.
# Номера — после упорядочивания по уровню трат (0 — самый высокий).
clusters:
  0:
    name: "Пригороды столичных агломераций"
    short: "Столичные пригороды"
    desc: "Подмосковье и Ленинградская область. Самые высокие траты жителя и максимальная доступность рынков. В занятости выделяются торговля, логистика и обработка (склады, промпарки), на продукты уходит лишь около 36% трат. Экономика обслуживания мегаполиса."
  1:
    name: "Удалённый Северо-Восток"
    short: "Удалённый Северо-Восток"
    desc: "Якутские улусы, Камчатка, Колыма, Курилы, Чукотка. Высокие траты и зарплаты (северные надбавки), но маркетплейсы занимают всего 4–7% трат, в 3 раза меньше типичного: сказывается логистическая изоляция. Самая сильная сезонность трат с летним пиком (навигация, северный завоз, отпуска). Минимальная доступность рынков."
  2:
    name: "Ресурсные и вахтовые центры"
    short: "Ресурсные центры"
    desc: "Норильск, Югра, Ямал, Мурманская область, Коми, алмазная Якутия. Добыча — около 20% занятости крупных и средних организаций, ещё выделяется строительство. Самые высокие относительные зарплаты, а число работающих доходит до половины населения: вахта и приезжие работники. Летом траты растут (отпускной сезон)."
  3:
    name: "Крупные города и региональные центры"
    short: "Крупные города"
    desc: "Миллионники и региональные столицы. Рыночные услуги (IT, финансы, B2B), обработка, общепит и здоровье в тратах выше среднего. Самое большое население и устойчивое положение: в среднем меньше одной смены типа за два года."
  4:
    name: "Города и районы Сибири, Дальнего Востока и Севера"
    short: "Сибирь, ДВ и Север"
    desc: "Приморье, Красноярский и Забайкальский края, Приангарье, Амурская область: Артём, Междуреченск, Биробиджан, Усть-Илимск. Около девятой части типа — Европейский Север: Карелия, Архангельская, Мурманская и Вологодская области, Коми. Зарплаты выше медианы (районные коэффициенты и северные надбавки), заметна транспортная занятость, доступность рынков низкая. Промежуточный тип: сюда временно переходят граничные ресурсные и сельские МО."
  5:
    name: "Индустриальные малые и средние города"
    short: "Индустриальные города"
    desc: "Урал, Поволжье, Предкавказье: Орск, Сызрань, Нефтекамск, Зеленодольск. Обработка — около 18% занятости, средний уровень трат, хорошая доступность рынков. Тип сжимается: часть МО с падающей долей промышленной занятости дрейфует в аграрную глубинку."
  6:
    name: "Сельская периферия Сибири и Севера"
    short: "Сельская Сибирь и Север"
    desc: "Районы Приангарья, Тывы, Алтая, Новосибирской области и Красноярского края, а также Коми и Карелии. Бюджетный сектор даёт две трети занятости (максимум среди типов). Доля транспорта в тратах повышенная (расстояния), есть летний пик трат (дачи, туризм: Алтай, Байкал, Хакасия). Летом тип расширяется за счёт соседних районов."
  7:
    name: "Аграрная глубинка"
    short: "Аграрная глубинка"
    desc: "Самый массовый тип, около 43% МО: сельские районы Алтайского края, Кировской, Саратовской, Оренбургской областей, Башкортостана. Минимальные траты, наибольшие доли продуктов (48%) и маркетплейсов (до 18%). Сельское хозяйство и бюджетный сектор в занятости, зарплаты ниже медианы."

# Внутригородские типы Москвы и Санкт-Петербурга (sbx.intracity: только блоки трат,
# данных Росстата по районам нет). Номера — по убыванию трат (0 — самые высокие).
intracity:
  0:
    name: "Престижный центр и запад Москвы"
    short: "Престижный центр"
    desc: "Центр Москвы (Арбат, Тверской, Хамовники, Пресненский) и запад (Раменки, Крылатское, Дорогомилово), в Петербурге — Аптекарский остров и Чкаловское. Самые высокие траты, около 59 тыс. ₽ в месяц на жителя. На продукты уходит лишь 28%, на общепит 9%: сервисная экономика."
  1:
    name: "Обеспеченные срединные районы"
    short: "Срединные районы"
    desc: "Срединное кольцо Москвы (Измайлово, Кунцево, Строгино, Коньково), исторический центр и север Петербурга (Адмиралтейский, Васильевский, Комендантский аэродром). Траты около 49 тыс. ₽, продукты 31%, общепит 8,5%. Единственный тип, где Москва и Петербург представлены поровну."
  2:
    name: "Спальные районы Москвы"
    short: "Спальные районы"
    desc: "Восток и север Москвы (Гольяново, Перово, Бибирево, Отрадное), Солнцево и Зеленоград, а также северные пригородные посёлки Петербурга (Парголово, Песочный, Сестрорецк). Траты около 47 тыс. ₽, маркетплейсы около 13%."
  3:
    name: "Городские районы Петербурга"
    short: "Районы Петербурга"
    desc: "Внутренние районы Петербурга, от Коломны и Семёновского до Гражданки, Ульянки и Дачного; в Москве сюда попадают только Вешняки, Кузьминки и Северное Измайлово. Траты около 42 тыс. ₽ — ниже московских спальных районов, но доля общепита (7,7%) выше."
  4:
    name: "Периферия столиц"
    short: "Периферия"
    desc: "Новая Москва, промзоны и окраины (Капотня, Бирюлёво, Некрасовка) и пригородные города Петербурга (Колпино, Кронштадт, Петергоф, Павловск). Минимальные для столиц траты, около 41 тыс. ₽, больше всего продуктов (35%) и маркетплейсов (14%)."

meta:
  main_rule: attr
  final_method: spectral_evolutionary
  lead: "Сеть экономической близости 1815 муниципалитетов, перестроенная для каждого из 24 месяцев 2023–2024 годов. Узлы описаны безналичными тратами жителей (СберИндекс), отраслевой занятостью и зарплатами (Росстат), доступностью рынков. В сети выделяются 8 устойчивых типов локальных экономик: от столичных пригородов до аграрной глубинки и удалённого Северо-Востока."
  dynamics_text: "<p><b>Типология устойчива.</b> 71% МО не сменили тип ни разу за 24 месяца. 91% переходов происходят между соседними в пространстве признаков типами (Сибирь, ДВ и Север ↔ сельская Сибирь и Север, ресурсные центры ↔ Сибирь, ДВ и Север, индустриальные города ↔ аграрная глубинка), то есть это территории на границе типов, а не случайные скачки.</p><p><b>Сезонность.</b> «Сельская Сибирь и Север» каждое лето расширяется вдвое за счёт соседних районов (дачный и туристический сезон) и сжимается к зиме. Эффект повторяется в оба года.</p><p><b>Тренды.</b> Индустриальные города сократились с 31% до 24% МО: у ушедших в аграрный тип доля обрабатывающих производств в занятости снизилась с 11,7% до 7,3%. Доля маркетплейсов выросла на 34–45% в большинстве типов, а на удалённом Северо-Востоке почти вдвое (+84%). Разрыв растёт: траты в крупных городах выросли на 18%, на Северо-Востоке — на 11%.</p>"
  robust_text: "Каждый вес блока признаков изменялся в 0,5 и 1,5 раза, блок исключался целиком. Менялись также число соседей в графе, масштаб ядра, память эволюционной модели и seed."
  footer: "Данные: СберИндекс — потребительские расходы, индекс доступности рынков, транспортные связи и справочник границ МО (CC BY-SA 4.0, sberindex.ru, данные скачаны 30.09.2026); Росстат — База данных показателей муниципальных образований (численность работников и зарплата по ОКВЭД2, население, 2021–2024). В наборе СберИндекса нет Белгородской, Брянской, Курской, Воронежской, Ростовской областей, Краснодарского края, Крыма и Севастополя; внутригородские территории Москвы и Санкт-Петербурга анализируются отдельно. Код и методологический отчёт — в репозитории проекта."
