  method_cards:
    - step: "Шаг 1 · Атрибуты"
      title: "25 признаков в шести блоках"
      text: "Уровень и структура безналичных трат жителя (СберИндекс), сезонность, отраслевая структура занятости и зарплаты (БДПМО Росстата), доступность рынков и население. Доли переведены в CLR-координаты (геометрия Эйчисона). Данные, скрытые Росстатом из-за конфиденциальности, выделены в отдельный сектор: это признак моногорода, а не пропуск."
      formula: "x_it = [уровень, CLR(траты), сезонность, CLR(отрасли), труд, география]"
    - step: "Шаг 2 · Рёбра"
      title: "kNN-граф с самонастраивающимся ядром"
      text: "Каждый месяц МО соединяется с 15 ближайшими по атрибутам МО. Вес зависит от локального масштаба, поэтому граф связный и разреженный, а уникальные территории не становятся изолятами. С этим правилом сравнивались шесть альтернатив: корреляции и лаги динамики, DTW, дорожная близость, косинус трат, гибрид."
      formula: "w_ij = exp(−‖x_i − x_j‖² / σ_i σ_j),  σ_i = d(i, 7-й сосед)"
    - step: "Шаг 3 · Кластеризация"
      title: "Спектральный разрез сети"
      text: "Сеть делится на 8 групп с минимальным нормированным разрезом: внутри типа связи плотные, между типами редкие. Поскольку рёбра построены из атрибутов, разрез учитывает и атрибуты, и структуру близости: нелинейные «вытянутые» типы, которые k-means дробит, остаются целыми. Метод сравнивался с K-means, Ward, Leiden, AGC и темпоральным Leiden по шести ICVI и стал лучшим по сводному рангу."
      formula: "min Ncut(C_1…C_8) ≈ k-means по 8 собственным векторам L_sym = I − D^−½WD^−½"
    - step: "Шаг 4 · Время"
      title: "Эволюционная спектральная кластеризация"
      text: "Тип месяца t должен хорошо разрезать и текущую сеть, и сеть с памятью о прошлом (PCQ, Chi et al., 2007). Перестройки границ, не подкреплённые данными, гасятся, а сезонные сдвиги, которые держатся несколько месяцев, сохраняются. События (слияния, разделения) фиксируются сопоставлением снимков по мере Жаккара."
      formula: "W̃_t = α·W_t + (1−α)·W̃_t−1,  α = 0.5;  C_t = SpectralCut(W̃_t)"
    - step: "Шаг 5 · Проверка"
      title: "Почему этому можно доверять"
      text: "Число типов выбрано по устойчивости на бутстрэпе. Результат не зависит от seed, масштаба ядра и памяти модели (ARI 0,93–1,00). Внешняя проверка: у 53% пар соседних по дороге МО тип совпадает против 29% при случайных метках (z = 43), хотя дорожное соседство в модель не входит."
      formula: "k* = max{k : ARI_bootstrap(k) ≥ 0.8} = 8   (при k = 9 устойчивость падает до 0.53)"
