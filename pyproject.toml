[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbx"
version = "1.0.0"
description = "Кластеризация муниципалитетов РФ на динамической атрибутированной сети (конкурс СберИндекса)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
